name: build-images

# Builds every Go service with the shared root Dockerfile (ARG SERVICE) and
# pushes to a single GHCR package with one tag per service:
#   ghcr.io/<owner>/misarch-go:<service>            (moving tag)
#   ghcr.io/<owner>/misarch-go:<service>-<sha>      (immutable, for the thesis)
# One package instead of 17 keeps visibility management to a single setting.

on:
  push:
    branches: [go-rewrite]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service:
          [
            address, catalog, discount, inventory, invoice, media,
            notification, order, payment, return, review, shipment,
            shoppingcart, simulation, tax, user, wishlist,
          ]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/misarch-go:${{ matrix.service }}
            ghcr.io/${{ github.repository_owner }}/misarch-go:${{ matrix.service }}-${{ github.sha }}
          # All 17 builds share the go-mod dependency layer; a common cache
          # scope lets later matrix jobs reuse it.
          cache-from: type=gha,scope=misarch-go
          cache-to: type=gha,scope=misarch-go,mode=max
