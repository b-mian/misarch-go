# gqlgen config for the catalog service. Codegen: `go tool gqlgen generate` from
# this directory (schema.graphql is produced from the canonical MiSArch
# subgraph SDL by tools/sdlprep).
schema:
  - schema.graphql

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/models_gen.go
  package: graph

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

federation:
  filename: graph/federation.go
  package: graph
  version: 2

omit_slice_element_pointers: true
omit_getters: true

models:
  UUID:
    model: misarch/pkg/scalars.UUID
  DateTime:
    model: misarch/pkg/scalars.DateTime
  # Relationship fields are resolved lazily by their own field resolvers (never
  # eagerly embedded): object/entity/connection returns and the auth-gated
  # Product.internalName. extraFields carry the internal FKs the resolvers need
  # (folded to lowercase columns in the store queries).
  CategoricalCategoryCharacteristic:
    fields:
      category: { resolver: true }
      values: { resolver: true }
    extraFields:
      CategoryID:
        type: github.com/google/uuid.UUID
  NumericalCategoryCharacteristic:
    fields:
      category: { resolver: true }
    extraFields:
      CategoryID:
        type: github.com/google/uuid.UUID
  CategoricalCategoryCharacteristicValue:
    fields:
      characteristic: { resolver: true }
    extraFields:
      CharacteristicID:
        type: github.com/google/uuid.UUID
  NumericalCategoryCharacteristicValue:
    fields:
      characteristic: { resolver: true }
    extraFields:
      CharacteristicID:
        type: github.com/google/uuid.UUID
  Category:
    fields:
      products: { resolver: true }
      characteristics: { resolver: true }
  Product:
    fields:
      internalName: { resolver: true }
      defaultVariant: { resolver: true }
      variants: { resolver: true }
      categories: { resolver: true }
    extraFields:
      DefaultVariantID:
        type: github.com/google/uuid.UUID
  ProductVariant:
    fields:
      product: { resolver: true }
      currentVersion: { resolver: true }
      versions: { resolver: true }
    extraFields:
      ProductID:
        type: github.com/google/uuid.UUID
      CurrentVersionID:
        type: github.com/google/uuid.UUID
  ProductVariantVersion:
    fields:
      productVariant: { resolver: true }
      taxRate: { resolver: true }
      characteristicValues: { resolver: true }
      medias: { resolver: true }
    extraFields:
      ProductVariantID:
        type: github.com/google/uuid.UUID
      TaxRateID:
        type: github.com/google/uuid.UUID
