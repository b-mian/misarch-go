services:
  inventory:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: inventory
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 1s
      timeout: 10s
      retries: 20
      start_period: 3s
    depends_on:
      - inventory-db
    environment:
      - DATABASE_URI=mongodb://inventory-db:27017
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_METRIC_EXPORT_INTERVAL=5000
      - OTEL_SERVICE_NAME=inventory
  inventory-db:
    image: mongo:6.0
    hostname: inventory-db
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
    volumes:
      - inventory-db-data:/data/db
    command: mongod --replSet rs0 --bind_ip_all
  mongosetup:
    image: mongo:6.0
    depends_on:
      - inventory-db
    restart: "no"
    # Retry until mongod accepts connections; idempotent if the RS already
    # exists (a fixed sleep loses the race on cold multi-container starts,
    # and nothing ever re-runs rs.initiate afterwards).
    entrypoint: [ "bash", "-c", "until mongosh --host inventory-db:27017 --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate().ok }' | grep -q 1; do sleep 2; done; echo 'replica set ready'"]
  inventory-dapr:
    image: "daprio/daprd:edge"
    network_mode: "service:inventory"
    command:
      [
        "./daprd",
        "--app-id",
        "inventory",
        "--app-port",
        "${EXPERIMENT_CONFIG_SIDECAR_PORT:-8080}",
        "--dapr-http-port",
        "3500",
        "-placement-host-address",
        "placement:50006",
        "--config",
        "/config.yaml",
        "--resources-path",
        "/components",
      ]

volumes:
  inventory-db-data:
