# gqlgen config for the media service. Codegen: `go tool gqlgen generate` from
# this directory (schema.graphql is produced from the canonical MiSArch
# subgraph SDL by tools/sdlprep).
schema:
  - schema.graphql

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/models_gen.go
  package: graph

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

federation:
  filename: graph/federation.go
  package: graph
  version: 2

omit_slice_element_pointers: true
omit_getters: true

models:
  UUID:
    model: misarch/pkg/scalars.UUID
  Upload:
    model: github.com/99designs/gqlgen/graphql.Upload
  # Media.path is resolved lazily via a field resolver: it performs a live S3
  # list + pre-sign only when a client selects `path` (never eagerly embedded
  # in the model struct). The Media model therefore carries only ID.
  Media:
    fields:
      path: { resolver: true }
