# gqlgen config for the shoppingcart service. Codegen: `go tool gqlgen generate` from
# this directory (schema.graphql is produced from the canonical MiSArch
# subgraph SDL by tools/sdlprep).
schema:
  - schema.graphql

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/models_gen.go
  package: graph

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

federation:
  filename: graph/federation.go
  package: graph
  version: 2

omit_slice_element_pointers: true
omit_getters: true

models:
  UUID:
    model: misarch/pkg/scalars.UUID
  DateTime:
    model: misarch/pkg/scalars.DateTime
  ShoppingCart:
    fields:
      # Paginated in memory over the embedded item set (Items below), sorted by
      # item UUID bytes. Resolved lazily so unrequested carts do no work.
      shoppingcartItems: { resolver: true }
    extraFields:
      # Internal: the full loaded item set, populated by the User entity /
      # cart loaders; not part of the GraphQL schema. The connection resolver
      # sorts + paginates this slice.
      Items:
        type: "[]misarch/shoppingcart/graph.ShoppingCartItem"
  ShoppingCartItem:
    fields:
      # ProductVariant is a foreign object type; resolve it lazily from the
      # stored variant id rather than embedding it in the item struct.
      productVariant: { resolver: true }
    extraFields:
      ProductVariantID:
        type: github.com/google/uuid.UUID
